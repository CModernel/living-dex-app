name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm ci requires the lockfile to carry a resolvable entry for every optional
        # platform-specific dependency (native rolldown/oxlint bindings). Ours only has
        # macOS entries (generated on a Mac) due to a known npm bug (npm/cli#4828) — npm
        # doesn't always record other platforms' optional deps when the lockfile is written.
        # `npm install` re-resolves the correct binary for the runner's actual platform.
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build:web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
